spring.application.name=NexusBackendCore

# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.nexus.backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# DataSource Configuration (MySQL). The credentials come from the environment, never from the repository.
spring.datasource.url=jdbc:mysql://localhost:3306/nexusdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration Properties. JWT_SECRET is required (32 or more random bytes): there is no default on purpose,
# a secret written here would let anyone who reads the repository sign valid tokens.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=7

# First administrator, created at startup only when both are set. The public sign-up only creates clients.
nexus.admin.username=${NEXUS_ADMIN_USERNAME:}
nexus.admin.password=${NEXUS_ADMIN_PASSWORD:}

# Browser origins allowed to call the API, comma-separated
nexus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Only the health check is public; it says UP or DOWN and nothing else
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never