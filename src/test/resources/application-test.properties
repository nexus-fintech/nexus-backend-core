# Perfil "test": base H2 en memoria en lugar de MySQL, para que las pruebas corran sin servicios externos.
spring.datasource.url=jdbc:h2:mem:nexusdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Clave solo para pruebas (HS256 necesita al menos 32 bytes)
authorization.jwt.secret=nexus-backend-core-test-secret-0123456789abcdef

# El motor de riesgo se reemplaza por un mock en las pruebas; esta URL nunca se llama
risk.engine.url=http://localhost:9/api/v1
